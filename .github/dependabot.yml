version: 2
# No `labels:` here: Dependabot then labels its pull requests `dependencies`
# plus `rust` or `github_actions`, and creates them if missing. Labels named
# here would have to exist in the repository already.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # A release must age a week before Dependabot proposes it; security
    # updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      patch-updates:
        update-types:
          - patch
      minor-updates:
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # A release must age a week before Dependabot proposes it; security
    # updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        update-types:
          - patch
          - minor
