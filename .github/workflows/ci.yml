name: CI

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "deny.toml"
      - ".typos.toml"
      - "scripts/**"
      - ".github/**"
      - "codecov.yml"
      # Embedded in the binary, and copied by the Docker build.
      - "skill/**"
      - "Dockerfile"
      - ".dockerignore"
  # No paths filter here: the branch ruleset requires ci-success, and a
  # workflow skipped by `paths` leaves a required check waiting forever, so a
  # docs-only PR could not be merged.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spell-check
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  deny:
    name: cargo-deny (advisories + bans + licenses + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  lint:
    name: lint (fmt + clippy + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug-ubuntu
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check docs/reference/ is up to date
        run: |
          scripts/gen-docs.sh
          git diff --exit-code docs/reference/

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os == 'Linux' && 'debug-ubuntu' || format('test-{0}', matrix.os) }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo test
        run: cargo test --all-targets --locked

      # A debug build never updates the installed skill, so the tests of that
      # are left out above. Without debug assertions they run. Everything is
      # built again for it, outside the cached target.
      - name: cargo test (skill update)
        env:
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "false"
          CARGO_TARGET_DIR: ${{ runner.temp }}/no-debug-assertions
        run: cargo test --locked --test "cli_skill*"

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml so this job genuinely
    # exercises the declared MSRV rather than the pinned toolchain.
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.95"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo check
        run: cargo check --all-targets --locked

  contract:
    name: contract (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Install Node.js (for Prism mock server)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # A pinned npm package: Prism ships no checksummed binary to install instead.
      - name: Install Prism CLI
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g @stoplight/prism-cli@5.16.0
          prism --version

      - name: Cache OpenAPI specs (downloaded + patched)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/contract/specs
          key: contract-specs-${{ hashFiles('tests/contract/download_specs.sh', 'tests/contract/patch_specs.py') }}

      - name: Download and patch OpenAPI specs
        run: |
          bash tests/contract/download_specs.sh
          python3 tests/contract/patch_specs.py

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug-ubuntu
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo test (ignored / contract)
        run: cargo test --locked -- --ignored

  build-release-smoke:
    name: build-release-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache cargo registry and target (release)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo build --release
        run: cargo build --release --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      # Coverage runs both regular and contract tests in one pass via
      # `--include-ignored`, so `client/{jira,confluence}.rs` (~3k LOC of
      # HTTP code exercised only by Prism-backed contract tests) gets
      # measured. Without this the project number understates coverage by
      # ~30 percentage points.
      - name: Install Node.js (for Prism mock server)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # A pinned npm package: Prism ships no checksummed binary to install instead.
      - name: Install Prism CLI
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g @stoplight/prism-cli@5.16.0
          prism --version

      - name: Cache OpenAPI specs (downloaded + patched)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/contract/specs
          key: contract-specs-${{ hashFiles('tests/contract/download_specs.sh', 'tests/contract/patch_specs.py') }}

      - name: Download and patch OpenAPI specs
        run: |
          bash tests/contract/download_specs.sh
          python3 tests/contract/patch_specs.py

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov@0.9.2

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --all-targets --locked --lcov --output-path lcov.info -- --include-ignored

      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codecov (fork PR, best-effort)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false

  # actionlint (syntax, expressions, shellcheck on `run:` scripts) and zizmor
  # (security audits, configured in .github/zizmor.yml). zizmor runs offline:
  # its online audits follow upstream branches and tags, which would turn a
  # required check red without a change in this repository.
  workflows:
    name: workflows (actionlint + zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: zizmor@1.32.0

      # go install checks the module against the Go checksum database.
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor --offline --min-severity low --format github .

  # The one required status check: the branch ruleset requires this job
  # instead of each job above, whose names change with the matrix.
  ci-success:
    name: ci-success
    needs: [typos, deny, lint, test, msrv, contract, build-release-smoke, coverage, workflows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All CI checks passed"
