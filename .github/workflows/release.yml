name: Release

on:
  push:
    tags:
      # One- or two-digit ISO week (2027.1.1, 2026.47.3); verify-version checks
      # the exact format.
      - 'v[0-9][0-9][0-9][0-9].[0-9]*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: verify-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Validate tag and Cargo.toml version
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.([1-9]|[1-4][0-9]|5[0-3])\.[1-9][0-9]*$'; then
            echo "::error::Tag '$TAG' does not match vYYYY.WW.BUILD format" >&2
            exit 1
          fi

          CARGO_VERSION=$(cargo pkgid | awk -F'[#@]' '{print $NF}')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($VERSION). Run scripts/bump-version.sh before tagging." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

  build:
    name: build (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: atl
            archive: tar.gz
          # Linux arm64 through the cross toolchain, as in dq.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: atl
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: atl
            archive: tar.gz
          # Intel macOS, built on the arm64 runner: Apple's toolchain targets
          # x86_64 natively, so no cross toolchain. The binary may not run on
          # the runner, so the docs come from a host build (host_docs).
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: atl
            archive: tar.gz
            host_docs: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: atl.exe
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the toolchain cargo runs here, and the step
      # above adds the target to stable only. Without this, a target that is
      # neither the host nor set up by the cross toolchain action
      # (x86_64-apple-darwin) fails with "can't find crate for `core`".
      - name: Add the target to the pinned toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      # Targets whose binary the runner cannot run (cross, host_docs) build a
      # host binary first, only to run `atl generate-docs`: the output does not
      # depend on the target. This MUST come before the cross toolchain is set
      # up, because taiki-e/setup-cross-toolchain-action exports
      # CARGO_BUILD_TARGET for the rest of the job, after which a plain
      # `cargo build` cross-compiles and `target/release/atl` stays empty.
      - name: Build host binary and generate docs (cross and host_docs targets)
        if: matrix.cross || matrix.host_docs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          ./target/release/atl generate-docs --output-dir dist/_docs

      - name: Set up cross toolchain
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Generate man pages and completions (native targets only)
        if: ${{ !matrix.cross && !matrix.host_docs }}
        shell: bash
        run: |
          set -euo pipefail
          "target/${{ matrix.target }}/release/${{ matrix.bin }}" generate-docs --output-dir dist/_docs

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          NAME="atl-${VERSION}-${TARGET}"
          mkdir -p "dist/${NAME}"
          cp "target/${TARGET}/release/${BIN}" "dist/${NAME}/"
          cp LICENSE "dist/${NAME}/"
          mkdir -p "dist/${NAME}/man" "dist/${NAME}/completions"
          cp -R dist/_docs/man/. "dist/${NAME}/man/"
          cp -R dist/_docs/completions/. "dist/${NAME}/completions/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "atl-${env:VERSION}-${env:TARGET}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${env:TARGET}/release/${env:BIN}" "dist/$name/"
          Copy-Item "LICENSE" "dist/$name/"
          New-Item -ItemType Directory -Force -Path "dist/$name/man" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/$name/completions" | Out-Null
          Copy-Item "dist/_docs/man/*" "dist/$name/man/" -Recurse -Force
          Copy-Item "dist/_docs/completions/*" "dist/$name/completions/" -Recurse -Force
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "dist/$name.zip.sha256" -Encoding ascii -NoNewline

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atl-${{ matrix.target }}
          path: |
            dist/atl-${{ needs.verify-version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/atl-${{ needs.verify-version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          retention-days: 14
          if-no-files-found: error

  release:
    name: release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: atl-*
          merge-multiple: true

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/atl-*.tar.gz
            dist/atl-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.verify-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/atl-*
          fail_on_unmatched_files: true

  # The image is built only once the release is out, from the same tag. A
  # release that fails before this point publishes no image.
  docker:
    name: docker
    needs: [verify-version, release]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ github.ref_name }}
