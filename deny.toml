# cargo-deny configuration
#
# Run locally with: cargo deny check
# CI gate: .github/workflows/ci.yml (job: deny)

[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: DoS in quick-xml < 0.41.0 (quadratic
  # duplicate-attribute check; unbounded namespace-declaration allocation).
  # Our direct quick-xml dependency is pinned to 0.41 and is NOT in the affected
  # range. The only remaining affected copy is quick-xml 0.38.4, pinned purely
  # transitively by self_update 0.44.0 (a non-optional dependency — none of the
  # self_update features we enable in Cargo.toml gate it). No self_update
  # release, including 1.0.0-rc.1, has moved off `quick-xml = "^0.38"`, so the
  # pin cannot be raised yet — revisit when one does. Within self_update,
  # quick-xml is used only by its S3 backend (self_update/src/backends/s3.rs);
  # atl calls only self_update::backends::github (src/cli/commands/updater.rs)
  # and never the S3 backend, so the vulnerable parser is unreachable at
  # runtime. Both advisory ranges are `< 0.41.0`, so this ignore cannot mask a
  # regression in our own 0.41 dependency.
  { id = "RUSTSEC-2026-0194", reason = "transitive-only: quick-xml 0.38.4 pinned by self_update 0.44.0 (^0.38); its sole user is self_update's S3 backend, which atl never invokes" },
  { id = "RUSTSEC-2026-0195", reason = "transitive-only: quick-xml 0.38.4 pinned by self_update 0.44.0 (^0.38); its sole user is self_update's S3 backend, which atl never invokes" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # Used by webpki-root-certs (bundled Mozilla trust roots, transitive via rustls).
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Permit the wildcard on the `atl` self dev-dependency (Cargo.toml [dev-dependencies]),
# which enables the `test-util` feature for integration tests under tests/. Path
# deps are local, not a supply-chain vector, so this stays scoped to paths only;
# registry wildcards remain denied.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
